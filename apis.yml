name: Houst
description: >-
  Houst is a global short-term rental and Airbnb management company founded in
  2015, operating in 17 cities across 8 countries and managing over 11,650
  properties. Houst handles the full hosting lifecycle for homeowners and
  landlords - multi-platform listing creation and optimization, dynamic pricing,
  professional photography, 24/7 guest communication and vetting, check-in
  coordination, cleaning, linen and maintenance - powered by a proprietary host
  dashboard that tracks earnings, occupancy, bookings and performance. The
  company operates on a commission model and also runs an operating-partner and
  affiliate programme. Surfaced as a portfolio company of 500 Global and added
  to the API Evangelist network; no public developer API is currently published.
